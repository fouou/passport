plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fou.passport'
    compileSdk 33

    viewBinding {
        enabled = true
    }

    defaultConfig {
        applicationId "com.fou.passport"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.preference:preference:1.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    //material3
    implementation 'com.google.android.material:material:1.9.0'
    //Room
    implementation("androidx.room:room-runtime:2.5.1")
    annotationProcessor("androidx.room:room-compiler:2.5.1")
    //cipher加密
    implementation "net.zetetic:android-database-sqlcipher:4.5.3"
    implementation "androidx.sqlite:sqlite:2.3.1"
    //gson
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.9.0'
    //okhttp
    implementation(platform("com.squareup.okhttp3:okhttp-bom:4.11.0"))
    // define a BOM and its version
    implementation("com.squareup.okhttp3:okhttp")
    // define any required OkHttp artifacts without version
    // implementation("com.squareup.okhttp3:logging-interceptor") //logging-interceptor
    // 3. Android - Use Guava in your implementation only:
    implementation("com.google.guava:guava:31.1-android")
    //保证多库版本同步，修复因添加 implementation 'androidx.preference:preference:1.2.0' 而出现的
    // Duplicate class androidx.lifecycle.ViewModelLazy found in modules lifecycle-viewmodel-2.5.0-runtime (androidx.lifecycle:lifecycle-viewmodel:2.5.0) and lifecycle-viewmodel-ktx-2.3.1-runtime (androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1)
    //Duplicate class androidx.lifecycle.ViewTreeViewModelKt found in modules lifecycle-viewmodel-2.5.0-runtime (androidx.lifecycle:lifecycle-viewmodel:2.5.0) and lifecycle-viewmodel-ktx-2.3.1-runtime (androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1)错误
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    //生物验证
    implementation 'androidx.biometric:biometric:1.2.0-alpha04'
    //preference
    implementation 'androidx.preference:preference:1.1.0-alpha04'
}